[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-dota-mcp"
version = "0.1.0"
description = "A local MCP server for compact professional Dota 2 draft and match analysis."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
dependencies = [
  "fastmcp>=2.12,<4",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
]

[project.scripts]
open-dota-mcp = "open_dota_mcp.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/open_dota_mcp"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "D"]
ignore = ["D100", "D104", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
